name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$p = Get-Content src/Arrakis/Arrakis.csproj
            $v = $p.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build Arrakis.exe
        shell: pwsh
        run: >
          dotnet publish src/Arrakis/Arrakis.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:Version=${{ steps.ver.outputs.version }} -o publish -nologo

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DPublishDir=..\publish" installer\Arrakis.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist\Arrakis-Setup-${{ steps.ver.outputs.version }}.exe" "dist\Arrakis-Setup.exe"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: Arrakis-Setup-${{ steps.ver.outputs.version }}
          path: dist/Arrakis-Setup.exe

      - name: Is this a new version?
        id: rel
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT } else { "new=true" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Publish release
        if: steps.rel.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Arrakis ${{ steps.ver.outputs.version }}
          make_latest: true
          files: dist/Arrakis-Setup.exe
          body: |
            ## Download

            **[Arrakis-Setup.exe](https://github.com/bhxuk/arrakis/releases/download/v${{ steps.ver.outputs.version }}/Arrakis-Setup.exe)**, then double-click it. No admin rights needed.

            Windows may show "Windows protected your PC" because the installer isn't code-signed. Click **More info** and then **Run anyway**.

            See the [user guide](https://github.com/bhxuk/arrakis/blob/main/docs/USER-GUIDE.md) and [what's new](https://github.com/bhxuk/arrakis/blob/main/CHANGELOG.md).
